  .jump-nav { position:sticky; top:0; z-index:50; background:#1e293b; display:flex; gap:10px; justify-content:center; padding:9px 8px; flex-wrap:wrap; }
  .jump-nav a { color:#e2e8f0; text-decoration:none; font-size:0.85rem; font-weight:600; background:#334155; padding:6px 13px; border-radius:6px; transition:0.15s; }

<body>

  <script>
    function fit(f){ try { var d=f.contentDocument||f.contentWindow.document; if(d&&d.body){ f.style.height=(d.body.scrollHeight+40)+'px'; } } catch(e){} }
    ['gbFrame','bileDuctFrame'].forEach(function(id){
      var f=document.getElementById(id);
      f.addEventListener('load', function(){ fit(f); [400,1200,2500,4000].forEach(function(t){ setTimeout(function(){ fit(f); }, t); }); });
    });
    window.addEventListener('resize', function(){ ['gbFrame','bileDuctFrame'].forEach(function(id){ fit(document.getElementById(id)); }); });
  </script>
