<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kidney — Dr. Irene Lee + jamesxxx1997</title>
<style>
  body { font-family:'Segoe UI',sans-serif; background:#f8fafc; margin:0; }
  .src-banner { max-width:1400px; margin:18px auto 0; padding:12px 20px; border-radius:8px; font-size:0.97rem; line-height:1.5; }
  .src-senior { background:#e0f2fe; border-left:6px solid #0ea5e9; color:#0369a1; }
  .src-mine { background:#dcfce7; border-left:6px solid #10b981; color:#047857; }
  .src-banner a { color:inherit; font-weight:bold; }
  iframe { width:100%; border:none; display:block; background:#f8fafc; }
  .divider { max-width:1300px; margin:34px auto; border-top:2px dashed #cbd5e1; }
  .jump-nav { position:sticky; top:0; z-index:50; background:#1e293b; display:flex; gap:10px; justify-content:center; padding:9px 8px; flex-wrap:wrap; }
  .jump-nav a { color:#e2e8f0; text-decoration:none; font-size:0.85rem; font-weight:600; background:#334155; padding:6px 13px; border-radius:6px; transition:0.15s; }
  .jump-nav a:hover { background:#0ea5e9; color:#fff; }
  .src-banner { scroll-margin-top:52px; }
</style>
</head>
<body>
  <div class="jump-nav">
    <a href="#sec1">📘 Section 1 學姊 · CT/MRI 決策樹</a>
    <a href="#sec2">📗 Section 2 超音波 · US 鑑別與處置</a>
  </div>
  <div id="sec1" class="src-banner src-senior">📘 <b>Section 1 — Dr. Irene Lee (學姊)</b> · CT/MRI 導向診斷樹，adapted from her <a href="https://drireneleemd.github.io/diagnostic-tools/" target="_blank">original meta-site</a>.</div>
  <iframe id="seniorFrame" src="senior/kidneys.html" scrolling="no"></iframe>
  <div class="divider"></div>
  <div id="sec2" class="src-banner src-mine">📗 <b>Section 2 — jamesxxx1997</b> · 超音波導向：偶發病灶處置流程、高回音 AML vs RCC 鑑別、實質腫塊 US 圖鑑（由本人影像筆記整理）。</div>
  <iframe id="mineFrame" src="mine/kidneys.html" scrolling="no"></iframe>
  <script>
    var FRAMES=['seniorFrame','mineFrame'];
    function fit(f){ try { var d=f.contentDocument||f.contentWindow.document; if(d&&d.body){ f.style.height=(d.body.scrollHeight+40)+'px'; } } catch(e){} }
    FRAMES.forEach(function(id){
      var f=document.getElementById(id);
      f.addEventListener('load', function(){
        fit(f); [400,1200,2500,4000].forEach(function(t){ setTimeout(function(){ fit(f); }, t); });
        // mine/kidneys.html has an interactive picker + tab sections that change height; keep refitting.
        try {
          var d=f.contentDocument||f.contentWindow.document;
          if(d&&d.body&&window.ResizeObserver){ new ResizeObserver(function(){ fit(f); }).observe(d.body); }
          if(f.contentWindow){ f.contentWindow.addEventListener('hashchange', function(){ [50,250,600].forEach(function(t){ setTimeout(function(){ fit(f); }, t); }); }); }
        } catch(e){}
      });
    });
    window.addEventListener('resize', function(){ FRAMES.forEach(function(id){ fit(document.getElementById(id)); }); });
  </script>
</body>
</html>
